[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "goal-driven-decision-engine"
version = "0.1.0"
description = "Evidence-first goal-driven quantitative decision support"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[project.scripts]
gqde = "gqde.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
